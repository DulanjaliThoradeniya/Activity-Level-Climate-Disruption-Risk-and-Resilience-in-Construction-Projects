name: Update bundled NEA climate history

on:
  schedule:
    # 07:00 Singapore time (SGT, UTC+8) on every calendar day.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-history:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install forecasting dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and validate an isolated climate release
        id: climate
        run: bash .github/scripts/prepare-climate-release.sh refresh
      - name: Publish the refreshed static data
        run: |
          cp "${{ steps.climate.outputs.directory }}/data/climate-history.json" data/climate-history.json
          cp "${{ steps.climate.outputs.directory }}/data/climate-forecasts.json" data/climate-forecasts.json
          cp "${{ steps.climate.outputs.directory }}/data/climate-multi-model-forecasts.json" data/climate-multi-model-forecasts.json
          cp "${{ steps.climate.outputs.directory }}/data/climate-offline.js" data/climate-offline.js
          bash .github/scripts/publish-climate-data.sh \
            "Update bundled NEA climate forecasts" \
            data/climate-history.json data/climate-forecasts.json data/climate-multi-model-forecasts.json data/climate-offline.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.climate.outputs.directory }}
      - id: deployment
        uses: actions/deploy-pages@v4
