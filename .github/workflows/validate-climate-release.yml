name: Validate climate release without publishing

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install forecasting dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and validate without publishing
        run: bash .github/scripts/prepare-climate-release.sh bundled
