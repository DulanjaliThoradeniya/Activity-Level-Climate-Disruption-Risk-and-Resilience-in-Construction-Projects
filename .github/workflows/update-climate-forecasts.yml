name: Update daily NEA Prophet forecasts

on:
  # Scheduled daily runs are handled by update-climate-history.yml (history + forecasts).
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-forecasts:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install forecasting dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate current 14-day Prophet forecasts
        run: python "Climate Model/Trained model/build_prophet_forecasts.py"
      - name: Generate compatible static model forecasts
        run: python "Climate Model/Trained model/build_multi_model_forecasts.py"
      - name: Generate TFT forecasts without rebuilding other saved models
        run: python "Climate Model/Trained model/build_remaining_climate_models.py" tft
      - name: Generate NeuralProphet forecasts without rebuilding other saved models
        run: python "Climate Model/Trained model/build_remaining_climate_models.py" neuralprophet_new
      - name: Publish the refreshed forecast data
        run: |
          if [ -z "$(git status --porcelain -- data/climate-forecasts.json data/climate-multi-model-forecasts.json)" ]; then
            echo "The published Prophet forecasts are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/climate-forecasts.json data/climate-multi-model-forecasts.json
            git commit -m "Update daily NEA Prophet forecasts"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
